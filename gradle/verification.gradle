tasks.register('verifyPlatformArtifacts') {
    group = 'verification'; dependsOn platformArtifacts.values(), desktopJar, platformVerification
    doLast {
        def artifacts = platformArtifacts.collect { key, task -> [key: key, file: task.get().archiveFile.get().asFile, target: key.endsWith(':8') ? 52 : 65] }
        artifacts += [key:'desktop', file:desktopJar.get().archiveFile.get().asFile, target:65]
        artifacts += [key:'platform-verification', file:platformVerification.get().archiveFile.get().asFile, target:52]
        artifacts.each { artifact ->
            new ZipFile(artifact.file).withCloseable { zip ->
                zip.entries().each { entry ->
                    def name = entry.name
                    if (name.endsWith('.class')) {
                        zip.getInputStream(entry).withCloseable { stream ->
                            def data = new DataInputStream(stream); assert data.readInt() == (0xCAFEBABE as int)
                            data.readUnsignedShort(); def major = data.readUnsignedShort()
                            if (name.startsWith('club/heiqi/uilib/')) assert major == artifact.target : "${artifact.key}:${name} major=${major}"
                            def bytes = zip.getInputStream(entry).withCloseable { it.bytes }
                            def bytecode = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                            assert !bytecode.contains('me/eigenraven/lwjgl3ify') : name
                            if (artifact.key != 'platform-verification') {
                                ['net/minecraft/', 'net/minecraftforge/', 'cpw/mods/'].each { assert !bytecode.contains(it) : name + ' -> ' + it }
                            }
                        }
                        assert !name.startsWith('club/heiqi/uilib/ui/') || artifact.key == 'platform-verification' : '适配包重复核心定义: ' + name
                        if (artifact.key != 'platform-verification') assert !name.startsWith('club/heiqi/uilib/testing/') && !name.startsWith('club/heiqi/uilib/internal/devtools/') : name
                    }
                    if (artifact.key != 'platform-verification') assert !name.startsWith('assets/qz_uilib/gallery/') && !name.startsWith('assets/qz_uilib_test/') && !name.startsWith('uilib/localization/') : name
                }
            }
            logger.lifecycle('PLATFORM_ARTIFACT ' + artifact.key + ' major=' + artifact.target + ' ' + artifact.file)
        }
    }
}
tasks.register('verifyDevToolsNotPackaged') { group = 'verification'; dependsOn 'verifyPlatformArtifacts' }
// 构建失败时同样结束该次测试的临时 native 输入，不保留为外部缓存。
gradle.buildFinished {
    tasks.withType(JavaExec).each { task ->
        if (task.extensions.extraProperties.has('lwjgl2NativeDirectory')) {
            def temporary = task.extensions.extraProperties.get('lwjgl2NativeDirectory')
            try { delete temporary } catch (Exception cleanup) { logger.warn('无法清理测试 native 临时目录：' + temporary, cleanup) }
        }
    }
}

