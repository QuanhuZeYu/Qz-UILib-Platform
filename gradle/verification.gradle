ext.platformApplication = { String name, String entry, targetOrConfigure = 8, Closure configuration = {} ->
    int target = targetOrConfigure instanceof Closure ? 8 : targetOrConfigure
    Closure configure = targetOrConfigure instanceof Closure ? targetOrConfigure : configuration
    tasks.register(name, JavaExec) {
        group = 'verification'; dependsOn 'testClasses', 'prepareVerificationResources'
        mainClass = entry.contains('.') ? entry : 'club.heiqi.uilib.ui.scene.integration.' + entry
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(target) }
        if (target == 8) {
            doFirst {
                def configured = systemProperties['java.library.path']
                if (configured != null) {
                    def input = new File(configured.toString())
                    if (!input.absolute) input = new File(workingDir, configured.toString())
                    def temporary = java.nio.file.Files.createTempDirectory('qz-uilib-lwjgl2-').toFile()
                    ext.lwjgl2NativeDirectory = temporary
                    copy { from input; into temporary }
                    systemProperty 'java.library.path', temporary.absolutePath
                    logger.lifecycle('LWJGL2_TEST_NATIVE temporary=' + temporary + ' source=' + input)
                }
            }
        }
        classpath = sourceSets.test.runtimeClasspath
        jvmArgs '-Dfile.encoding=UTF-8'; maxHeapSize = '1g'
        workingDir(fixtureRoot)
        // Windows Java8 launcher 对中文绝对 classpath 解析失败；相同 JVM 使用工作目录相对路径。
        if (target == 8) doFirst {
            def base = workingDir.toPath().toAbsolutePath().normalize()
            def relative = { File file ->
                def path = file.toPath().toAbsolutePath().normalize()
                base.root == path.root ? base.relativize(path).toString() : path.toString()
            }
            def entries = classpath.files.collect { relative(it) }.join(File.pathSeparator)
            classpath = files(); jvmArgs '-cp', entries
            setArgs(args.collect { value -> def file = new File(value.toString()); file.absolute ? relative(file) : value })
            def options = new LinkedHashMap(systemProperties)
            options.each { key, value ->
                if (value != null && new File(value.toString()).absolute) systemProperty key, relative(new File(value.toString()))
            }
        }
        configure.delegate = delegate; configure.resolveStrategy = Closure.DELEGATE_FIRST; configure()
    }
}
