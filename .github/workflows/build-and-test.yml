name: Platform build
on:
  push:
    branches: ['**']
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      uilib_version:
        description: 'UILib 版本；留空使用 gradle.properties'
        required: false
        type: string
      uilib_core_tag:
        description: 'Core Release tag；留空使用 gradle.properties 的 uilibCoreTag'
        required: false
        type: string
      uilib_repository:
        description: '可选显式 Maven URL；留空则下载同 tag 的 Core Maven ZIP'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      INPUT_VERSION: ${{ inputs.uilib_version }}
      INPUT_CORE_TAG: ${{ inputs.uilib_core_tag }}
      EXPLICIT_REPOSITORY: ${{ inputs.uilib_repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 解析版本与 Core 来源
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-$(sed -n 's/^uilibVersion=//p' gradle.properties | tr -d '\r')}"
          CORE_TAG="${INPUT_CORE_TAG:-$(sed -n 's/^uilibCoreTag=//p' gradle.properties | tr -d '\r')}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-](alpha|beta|rc)[.-]?[0-9]+)?$ ]]; then
            echo "版本格式无效：$VERSION" >&2; exit 1
          fi
          if [[ -z "$EXPLICIT_REPOSITORY" && "${CORE_TAG#v}" != "$VERSION" ]]; then
            echo "Core tag $CORE_TAG 与版本 $VERSION 不一致；必须先准备同版本 Core Release" >&2; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CORE_TAG=$CORE_TAG" >> "$GITHUB_ENV"
      - name: 检查上游 Release 就绪状态
        id: upstreams
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPLICIT_MAVEN_REPOSITORY: ${{ env.EXPLICIT_REPOSITORY }}
        run: |
          set -euo pipefail
          node <<'NODE'
          process.env.UPSTREAM_RELEASES = JSON.stringify([{
            repo: 'QuanhuZeYu/Qz-UILib-Core', tag: process.env.CORE_TAG,
            asset: 'qz-uilib-core-' + process.env.VERSION + '-maven.zip'
          }]);
          require('./.github/scripts/upstream-ready.cjs');
          NODE
      - name: 下载同 tag Core Maven ZIP
        if: steps.upstreams.outputs.ready == 'true' && env.EXPLICIT_REPOSITORY == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf .release
          mkdir -p .release/core .release/maven
          if ! gh release download "$CORE_TAG" --repo QuanhuZeYu/Qz-UILib-Core \
            --pattern "qz-uilib-core-$VERSION-maven.zip" --dir .release/core --clobber; then
            echo "需要先发布 Core $CORE_TAG 的同版本 Maven ZIP（发布顺序 Core → Platform）" >&2
            exit 1
          fi
          python -m zipfile -e ".release/core/qz-uilib-core-$VERSION-maven.zip" .release/maven
      - uses: actions/setup-java@v4
        if: steps.upstreams.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: |
            8
            21
            25
      - uses: gradle/actions/setup-gradle@v4
        if: steps.upstreams.outputs.ready == 'true'
        with:
          # 只有默认分支 push 写缓存；PR、其他分支及手动来源只读。
          cache-read-only: ${{ github.event_name != 'push' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: 完整构建与发布资产
        if: steps.upstreams.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$EXPLICIT_REPOSITORY" ]]; then
            REPOSITORY="$EXPLICIT_REPOSITORY"
          else
            REPOSITORY="$(cygpath -w "$PWD/.release/maven")"
          fi
          ./gradlew build releaseAssets "-PuilibVersion=$VERSION" "-PuilibRepository=$REPOSITORY" --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: steps.upstreams.outputs.ready == 'true'
        with:
          name: platform-maven-zip
          path: build/release/qz-uilib-platform-${{ env.VERSION }}-maven.zip
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-results
          path: |
            build/reports
            build/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: 记录构建失败
        if: failure()
        shell: bash
        run: |
          echo "Platform 构建失败：查看失败步骤日志与可用的 platform-results 报告。Core ZIP 缺失时先完成同版本 Core Release（Core → Platform）。" >> "$GITHUB_STEP_SUMMARY"
