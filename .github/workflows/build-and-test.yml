name: Platform build
on:
  workflow_dispatch:
    inputs:
      uilib_repository:
        description: 'Core 正式与测试产物的 Maven 仓库 URL'
        required: true
        type: string
      uilib_version:
        description: '明确选择的 UILib 产物版本'
        required: true
        default: '4.11.1'
        type: string
jobs:
  build:
    # 完整场景需要实际窗口、GL 设备与音频设备。
    runs-on: [self-hosted, Windows, X64, qz-desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: 构建完整 Platform 与真实桌面场景
        shell: cmd
        run: gradlew.bat build "-PuilibVersion=%UILIB_VERSION%" "-PuilibRepository=%UILIB_REPOSITORY%"
        env:
          UILIB_REPOSITORY: ${{ inputs.uilib_repository }}
          UILIB_VERSION: ${{ inputs.uilib_version }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-results
          path: |
            build/reports
            build/distributions
