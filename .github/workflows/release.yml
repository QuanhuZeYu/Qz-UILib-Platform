name: Platform release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 Platform 与 Core 发布 tag，例如 5.0.0-beta1 或 v5.0.0-beta1'
        required: true
        type: string
      confirm:
        description: '发布确认短语：PUBLISH <tag>'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: 校验 tag、确认短语与版本
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          TAG="$INPUT_TAG"
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-](alpha|beta|rc)[.-]?[0-9]+)?$ ]]; then
            echo "tag 格式无效：$TAG" >&2; exit 1
          fi
          if [[ "$INPUT_CONFIRM" != "PUBLISH $TAG" ]]; then
            echo "确认短语不匹配：需要 PUBLISH $TAG" >&2; exit 1
          fi
          VERSION="${TAG#v}"
          DECLARED="$(sed -n 's/^uilibVersion=//p' gradle.properties | tr -d '\r')"
          if [[ "$DECLARED" != "$VERSION" ]]; then
            echo "gradle.properties 版本 $DECLARED 与 tag $TAG 不一致" >&2; exit 1
          fi
          git fetch --force --tags origin
          if [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$(git rev-parse HEAD)" ]]; then
            echo "tag $TAG 未指向本次检出的提交" >&2; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: 下载同 tag Core Maven ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf .release
          mkdir -p .release/core .release/maven
          if ! gh release download "$CORE_TAG" --repo QuanhuZeYu/Qz-UILib-Core \
            --pattern "qz-uilib-core-$VERSION-maven.zip" --dir .release/core --clobber; then
            echo "需要先发布 Core $CORE_TAG 的同版本 Maven ZIP（发布顺序 Core → Platform）" >&2
            exit 1
          fi
          python -m zipfile -e ".release/core/qz-uilib-core-$VERSION-maven.zip" .release/maven
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21
            25
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: 从 tag 完整构建
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          REPOSITORY="$(cygpath -w "$PWD/.release/maven")"
          ./gradlew build releaseAssets "-PuilibVersion=$VERSION" "-PuilibRepository=$REPOSITORY" --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: platform-release
          path: build/release/qz-uilib-platform-${{ steps.version.outputs.version }}-maven.zip
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-release-results
          path: |
            build/reports
            build/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: 记录构建失败
        if: failure()
        shell: bash
        run: |
          echo "Platform Release 构建失败：查看失败步骤日志与可用的 platform-release-results 报告。Core ZIP 缺失时先完成同 tag、同版本 Core Release（Core → Platform）。" >> "$GITHUB_STEP_SUMMARY"
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: platform-release
          path: release-assets
      - name: 检出本次工作流的发布工具与静态文案
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: |
            tools/release.mjs
            .changelogs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: 创建或更新同一 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          node .release-tools/tools/release.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --version "$VERSION" \
            --title "Qz-UILib Platform $VERSION" \
            --asset "release-assets/qz-uilib-platform-$VERSION-maven.zip" \
            --changelog ".release-tools/.changelogs/$TAG.md"
      - name: 记录发布失败
        if: failure()
        shell: bash
        run: |
          echo "Platform GitHub Release 失败：查看本 job 的失败步骤日志，确认发布状态后再决定是否重跑。" >> "$GITHUB_STEP_SUMMARY"
