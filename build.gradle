import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

buildscript {
    repositories { mavenCentral(); gradlePluginPortal() }
    dependencies { classpath 'com.gradleup.shadow:shadow-gradle-plugin:9.2.2' }
}
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.vanniktech.maven.publish.base' version '0.37.0'
}
apply plugin: 'com.gradleup.shadow'
ext.platformShadowJar = ShadowJar

// 本地开发组合由工作站 init 脚本供给项目属性；独立构建继续读取原 -P 与工程默认值。
version = findProperty('uilibVersion') ?: '5.0.0-beta1'
// 旧版调用仍使用历史坐标；新系列默认使用已验证的 Central namespace。
group = findProperty('uilibGroup') ?: (version.toString().tokenize('.')[0].toInteger() >= 5 ? 'asia.quanhuzeyu.uilib' : 'club.heiqi.uilib')
def uilibGroup = project.group.toString()
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
repositories {
    if (findProperty('uilibRepository')) {
        maven { url = uri(findProperty('uilibRepository')); content { includeGroup uilibGroup } }
    }
    maven { name = 'mojang'; url = uri('https://libraries.minecraft.net/'); content { includeGroup 'org.lwjgl.lwjgl'; includeModule 'com.ibm.icu', 'icu4j' } }
    mavenCentral()
}
configurations {
    coreDevelopment8; coreDevelopment21; coreRuntime8; coreRuntime21
    gallery; coreVerification; coreContent
}
dependencies {
    coreDevelopment8("${uilibGroup}:core:${version}:development-java8") { transitive = false }
    coreDevelopment21("${uilibGroup}:core:${version}:development") { transitive = false }
    coreRuntime8("${uilibGroup}:core:${version}:java8") { transitive = false }
    coreRuntime21("${uilibGroup}:core:${version}") { transitive = false }
    gallery("${uilibGroup}:gallery:${version}") { transitive = false }
    coreVerification("${uilibGroup}:core-verification:${version}") { transitive = false }
    coreContent 'com.ibm.icu:icu4j:76.1'
    coreContent 'org.yaml:snakeyaml:2.4'
    coreContent 'org.commonmark:commonmark:0.21.0'
    coreContent 'org.commonmark:commonmark-ext-gfm-strikethrough:0.21.0'
    coreContent 'org.commonmark:commonmark-ext-gfm-tables:0.21.0'
    coreContent 'org.jsoup:jsoup:1.19.1'
    coreContent 'org.nibor.autolink:autolink:0.10.0'
    // 仅验证侧读取实际宿主方法体，不进入任何生产适配。
    testImplementation 'org.ow2.asm:asm-commons:9.8'
}
apply from: 'gradle/native-runtime.gradle'

// 同一 Java 目标的消费者共享输出；两种目标始终编译同一份生产源。
ext.platformModules = [fontAdapter:'font-adapter', glRenderer:'gl-renderer', lwjgl2:'lwjgl2-adapter', lwjgl3:'lwjgl3-adapter', mediaAdapter:'media-adapter']
ext.nativeLicenseResources = file('src/nativeLicenses/resources')
ext.nativeLicenseDirectory = new File(nativeLicenseResources, 'assets/qz_uilib/licenses/native')
sourceSets.main { java.setSrcDirs([]); resources.setSrcDirs([]) }
platformModules.each { module, artifactName ->
    [8, 21].each { target ->
        def sourceName = module + (target == 21 ? '21' : '')
        sourceSets.create(sourceName) {
            java.setSrcDirs(["src/${module}/java"])
            resources.setSrcDirs(["src/${module}/resources"])
            compileClasspath = configurations[target == 8 ? 'coreDevelopment8' : 'coreDevelopment21'] + configurations.coreContent
            runtimeClasspath = output + compileClasspath
        }
    }
}
[8, 21].each { target ->
    def suffix = target == 21 ? '21' : ''
    sourceSets['fontAdapter' + suffix].compileClasspath += configurations.fontBindings
    sourceSets['fontAdapter' + suffix].resources.srcDirs(nativeLicenseResources, layout.buildDirectory.dir('generated/isolated-font'))
    tasks.named(sourceSets['fontAdapter' + suffix].processResourcesTaskName) { dependsOn 'packageFontBindings' }
    sourceSets['lwjgl2' + suffix].compileClasspath += sourceSets['glRenderer' + suffix].output + configurations.lwjgl2Bindings
    sourceSets['lwjgl3' + suffix].compileClasspath += sourceSets['glRenderer' + suffix].output + configurations.fontBindings
    sourceSets['mediaAdapter' + suffix].compileClasspath += configurations.mediaBindings
    sourceSets['mediaAdapter' + suffix].resources.srcDir(layout.buildDirectory.dir('generated/isolated-media'))
    tasks.named(sourceSets['mediaAdapter' + suffix].processResourcesTaskName) {
        dependsOn 'packageMediaBindings'
        // 共享全文保留媒体既有资源路径及清单字节。
        from(nativeLicenseDirectory) { include 'LWJGL-LICENSE.md', 'FreeType-FTL.txt'; into 'assets/qz_uilib/licenses/media' }
    }
}
sourceSets.create('desktop') {
    resources.srcDir(nativeLicenseResources)
    compileClasspath = configurations.coreDevelopment21 + configurations.coreContent + configurations.fontBindings + sourceSets.fontAdapter21.output + sourceSets.glRenderer21.output + sourceSets.lwjgl321.output + sourceSets.mediaAdapter21.output
}
sourceSets.test {
    compileClasspath = configurations.coreDevelopment8 + configurations.coreVerification + configurations.gallery + configurations.coreContent + configurations.fontBindings + sourceSets.fontAdapter.output + sourceSets.glRenderer.output + sourceSets.lwjgl3.output + configurations.testCompileClasspath
    runtimeClasspath = output + compileClasspath + configurations.fontNativeRuntime + configurations.testRuntimeClasspath
}
sourceSets.create('mediaTest') {
    compileClasspath = configurations.coreDevelopment8 + configurations.coreVerification + sourceSets.mediaAdapter.output + sourceSets.glRenderer.output
}
sourceSets.create('lwjgl2Test') {
    compileClasspath = configurations.coreDevelopment8 + configurations.coreVerification + configurations.coreContent + configurations.lwjgl2Bindings + sourceSets.fontAdapter.output + sourceSets.glRenderer.output + sourceSets.lwjgl2.output + sourceSets.mediaAdapter.output + sourceSets.mediaTest.output
}
sourceSets.create('desktopTest') {
    compileClasspath = configurations.coreDevelopment21 + configurations.coreVerification + configurations.gallery + configurations.coreContent + configurations.fontBindings + sourceSets.fontAdapter21.output + sourceSets.glRenderer21.output + sourceSets.lwjgl321.output + sourceSets.mediaAdapter21.output + sourceSets.desktop.output + sourceSets.mediaTest.output
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'; options.compilerArgs += ['-proc:none']
    options.release = name == 'compileDesktopJava' || name.endsWith('21Java') ? 21 : 8
}
tasks.named('jar') { enabled = false }
tasks.named('shadowJar') { enabled = false }
tasks.named('test', Test) { failOnNoDiscoveredTests = false; maxHeapSize = '1g' }

// 适配包仅重写共同内容引用，不复制或再次嵌入 Core 持有的内容库。
ext.platformArtifacts = [:]
ext.contentPackages = ['com.ibm.icu', 'org.yaml.snakeyaml', 'org.commonmark', 'org.jsoup', 'org.nibor.autolink']
platformModules.each { module, artifactName ->
    [8, 21].each { target ->
        def taskName = module == 'lwjgl2' ? (target == 8 ? 'lwjgl2AdapterLegacyJar' : 'lwjgl2AdapterJar') : module + (target == 8 ? 'LegacyJar' : 'Jar')
        if (module == 'lwjgl3') taskName = target == 8 ? 'lwjgl3AdapterLegacyJar' : 'lwjgl3AdapterJar'
        def artifact = tasks.register(taskName, ShadowJar) {
            group = 'build'; archiveBaseName = artifactName; archiveClassifier = target == 8 ? 'java8' : ''
            from sourceSets[module + (target == 21 ? '21' : '')].output
            configurations = []; enableAutoRelocation = false
            contentPackages.each { relocate it, 'club.heiqi.uilib.shadow.' + it }
            from('LICENSE'); from('THIRD-PARTY-NOTICES.md') { into 'META-INF' }
            exclude 'META-INF/versions/**', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class'
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        }
        platformArtifacts[artifactName + ':' + target] = artifact
        tasks.named('assemble') { dependsOn artifact }
    }
}
// 测试消费者只携带本仓测试定义；Core 与共享广场始终经独立坐标供给。
ext.platformVerification = tasks.register('platformVerificationJar', ShadowJar) {
    group = 'verification'; archiveBaseName = 'platform-verification'; archiveClassifier = ''
    from sourceSets.test.output, sourceSets.mediaTest.output, sourceSets.lwjgl2Test.output, sourceSets.desktopTest.output
    configurations = []; enableAutoRelocation = false
    contentPackages.each { relocate it, 'club.heiqi.uilib.shadow.' + it }
}
apply from: 'gradle/desktop.gradle'
apply from: 'gradle/verification.gradle'
apply from: 'gradle/publishing.gradle'